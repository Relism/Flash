name: CI

on:
  push:
    branches: [master]
  pull_request:
    # labeled: adding the dependencies label runs the interop job on a PR that already exists
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install h2spec 2.6.0
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/h2spec.tar.gz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  /tmp/h2spec.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/h2spec.tar.gz --directory /tmp

      - name: Install nghttp client
        run: |
          sudo apt-get update
          sudo apt-get install --yes nghttp2-client

      - name: Install grpcurl 1.9.3
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/grpcurl.tgz \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz
          echo "a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5  /tmp/grpcurl.tgz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/grpcurl.tgz --directory /tmp grpcurl

      - name: Build and test
        run: >-
          mvn -B
          -Dh2spec.executable=/tmp/h2spec
          -Dcurl.executable=/usr/bin/curl
          -Dnghttp.executable=/usr/bin/nghttp
          -Dgrpcurl.executable=/tmp/grpcurl
          -Djdk.tracePinnedThreads=full
          -Pjmh
          -Dflash.performance.gates=true
          clean verify

      # docs.yml runs this on release; failing here keeps a release from shipping without JavaDoc.
      - name: Check aggregated JavaDoc
        run: mvn -B -DskipTests javadoc:aggregate

      - name: Publish test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  interop:
    name: Interop
    # Real clients (curl, grpcurl, Node, WebDAV clients in containers) against the transports and
    # extensions. A dependency update is what most often changes how an extension behaves, so every
    # dependency PR runs them, and so does master.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.user.login == 'dependabot[bot]'
      || contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install grpcurl 1.9.3
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/grpcurl.tgz \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz
          echo "a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5  /tmp/grpcurl.tgz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/grpcurl.tgz --directory /tmp grpcurl

      # test, not verify: the coverage checks cannot pass on a run of the interop tests alone
      - name: Interop tests
        run: mvn -B -Pinterop -Dgrpcurl.executable=/tmp/grpcurl -Dcurl.executable=/usr/bin/curl clean test
