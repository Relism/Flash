name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  jitpack:
    name: Build on JitPack
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The first request starts the JitPack build under the groupId consumers use (dev.relism, from
      # the git.relism.dev TXT record); JitPack builds each groupId separately. The POM is served once
      # the build succeeds.
      - env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # JitPack serves the release as the tag without its v (3.0.2), the form consumers use.
          VERSION="${TAG#v}"
          base="https://jitpack.io/dev/relism/Flash"
          # Asked within seconds of the tag, JitPack answers "tag not found" and only rechecks later.
          sleep 120
          for _ in $(seq 60); do
            curl -sf -o /dev/null --max-time 60 "$base/flash/$VERSION/flash-$VERSION.pom" && exit 0
            sleep 30
          done
          curl -s "$base/$VERSION/build.log" | tail -n 80
          exit 1

  docs:
    name: Publish JavaDoc
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.release-please.outputs.version }}
