<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash — JavaDoc</title>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --border: #e5e7eb;

      --text: #111827;
      --muted: #6b7280;

      --accent: #111827;
      --accent-hover: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      min-height: 100vh;
      padding: 64px 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .header p {
      margin-top: 10px;

      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .latest {
      display: inline-flex;
      align-items: center;

      margin-top: 20px;
      padding-bottom: 2px;

      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;

      border-bottom: 1px solid transparent;

      transition:
        border-color 0.15s ease,
        color 0.15s ease;
    }

    .latest:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .list {
      border-top: 1px solid var(--border);
    }

    .release {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding: 18px 0;

      border-bottom: 1px solid var(--border);
    }

    .release-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .version {
      font-size: 0.96rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;

      color: var(--muted);

      border: 1px solid var(--border);
      padding: 2px 8px;
    }

    .release a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.92rem;
    }

    .release a:hover {
      text-decoration: underline;
    }

    .empty {
      padding: 32px 0;

      color: var(--muted);
      font-size: 0.95rem;
    }

    @media (max-width: 640px) {
      body {
        padding: 40px 20px;
      }

      .header h1 {
        font-size: 1.7rem;
      }

      .release {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <h1>Flash JavaDoc</h1>

      <p>
        API documentation for all published Flash releases.
      </p>

      
        <a class="latest" href="latest/index.html">
          Latest release — 3.0.3
        </a>
        
    </header>

    
      <div class="list">
        
    <div class="release">
      <div class="release-info">
        <span class="version">3.0.3</span>
        <span class='badge'>latest</span>
      </div>

      <a href="javadoc/3.0.3/index.html">Open</a>
    </div>
    

    <div class="release">
      <div class="release-info">
        <span class="version">3.0.2</span>
        
      </div>

      <a href="javadoc/3.0.2/index.html">Open</a>
    </div>
    

    <div class="release">
      <div class="release-info">
        <span class="version">3.0.1</span>
        
      </div>

      <a href="javadoc/3.0.1/index.html">Open</a>
    </div>
    

    <div class="release">
      <div class="release-info">
        <span class="version">2.0.0</span>
        
      </div>

      <a href="javadoc/2.0.0/index.html">Open</a>
    </div>
    
      </div>
      

  </div>
</body>
</html>
